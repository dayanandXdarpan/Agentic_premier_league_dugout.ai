version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Set your GCP project for Gemini (leave blank for MOCK mode)
      # - GCP_PROJECT_ID=your-project-id
      # - GCP_LOCATION=us-central1
      # If you have a service account JSON, mount it and uncomment this:
      # - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    # volumes:
      # - ./credentials.json:/app/credentials.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: 
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
    depends_on:
      - backend
    restart: unless-stopped
